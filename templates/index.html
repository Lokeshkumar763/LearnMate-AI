<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LearnMate AI</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <!-- Highlight.js -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css"
    >

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <!-- Marked -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>

    <!-- DOMPurify -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.5/purify.min.js"></script>

    <style>

        /* =========================================================
           RESET
        ========================================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* =========================================================
           DESIGN TOKENS
        ========================================================= */

        :root {
            --bg: #0a0a0b;
            --bg-sidebar: #0e0e10;

            --surface: #131315;
            --surface-2: #19191c;
            --surface-hover: #202024;

            --border: #232326;
            --border-strong: #2f2f34;

            --text-primary: #f3f3f1;
            --text-secondary: #9d9da4;
            --text-tertiary: #6b6b70;

            --accent: #86a9f2;
            --accent-soft: rgba(134, 169, 242, 0.14);
            --accent-strong: #b7cbff;

            --danger: #ef4444;

            --code-bg: #0d0d0f;

            --font-sans:
                'Inter',
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            --font-mono:
                'JetBrains Mono',
                "SFMono-Regular",
                Consolas,
                monospace;

            --radius-lg: 18px;
            --radius-md: 12px;
            --radius-sm: 8px;

            --ease: cubic-bezier(0.22, 1, 0.36, 1);

            --mx: 50%;
            --my: 25%;
        }

        /* =========================================================
           ACCESSIBILITY / REDUCED MOTION
        ========================================================= */

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
            border-radius: 6px;
        }

        /* =========================================================
           BODY
        ========================================================= */

        body {
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;

            background-image:
                radial-gradient(
                    640px circle at var(--mx) var(--my),
                    rgba(134, 169, 242, 0.10),
                    transparent 60%
                ),
                radial-gradient(
                    520px circle at calc(100% - var(--mx)) 0%,
                    rgba(180, 140, 255, 0.07),
                    transparent 55%
                ),
                radial-gradient(
                    480px circle at 15% 100%,
                    rgba(134, 224, 214, 0.05),
                    transparent 55%
                );

            background-attachment: fixed;
        }

        /* =========================================================
           AURORA ORB
        ========================================================= */

        .orb {
            position: relative;
            border-radius: 50%;
            flex-shrink: 0;

            filter:
                drop-shadow(0 6px 14px rgba(0, 0, 0, 0.45))
                drop-shadow(0 0 10px rgba(134, 169, 242, 0.18));

            transition: transform 0.4s var(--ease);
            will-change: transform;
        }

        .orb-spin {
            position: absolute;
            inset: 0;
            border-radius: 50%;

            background:
                conic-gradient(
                    from 0deg,
                    #86a9f2,
                    #c9a6f5,
                    #86e0d6,
                    #86a9f2
                );

            animation: orbSpin 7s linear infinite;
        }

        .orb::after {
            content: "";

            position: absolute;
            inset: 13%;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 30% 24%,
                    rgba(255, 255, 255, 0.32),
                    transparent 40%
                ),
                radial-gradient(
                    circle at 34% 30%,
                    #24242b 0%,
                    var(--surface) 62%
                );

            box-shadow:
                inset -2px -3px 5px rgba(0, 0, 0, 0.55),
                inset 2px 3px 4px rgba(255, 255, 255, 0.05);
        }

        @keyframes orbSpin {
            to {
                transform: rotate(360deg);
            }
        }

        .orb.tiny {
            width: 22px;
            height: 22px;
        }

        .orb.small {
            width: 30px;
            height: 30px;
        }

        .orb.hero {
            width: 56px;
            height: 56px;
        }

        .tilt-el {
            transition:
                transform 0.35s var(--ease),
                box-shadow 0.35s var(--ease);

            will-change: transform;
        }

        /* =========================================================
           APP LAYOUT
        ========================================================= */

        .app {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* =========================================================
           SIDEBAR
        ========================================================= */

        .sidebar {
            width: 264px;

            background: var(--bg-sidebar);

            border-right: 1px solid var(--border);

            display: flex;
            flex-direction: column;

            padding: 16px;
        }

        .brand-row {
            display: flex;
            align-items: center;
            gap: 10px;

            padding: 4px 4px 18px;
        }

        .brand-name {
            font-size: 14.5px;
            font-weight: 650;
            letter-spacing: -0.2px;
        }

        .new-chat {
            width: 100%;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

            padding: 11px 14px;

            background: var(--surface);

            border: 1px solid var(--border-strong);
            border-radius: 10px;

            color: var(--text-primary);

            font-family: inherit;
            font-size: 13.5px;
            font-weight: 600;

            cursor: pointer;

            box-shadow:
                0 2px 0 rgba(0, 0, 0, 0.35),
                0 5px 12px rgba(0, 0, 0, 0.2);

            transition:
                background 0.2s,
                border-color 0.2s,
                transform 0.2s,
                box-shadow 0.2s;
        }

        .new-chat:hover {
            background: var(--surface-hover);
            border-color: var(--accent);

            transform: translateY(-1px);

            box-shadow:
                0 3px 0 rgba(0, 0, 0, 0.35),
                0 8px 18px rgba(0, 0, 0, 0.28);
        }

        .new-chat:active {
            transform: translateY(2px);

            box-shadow:
                0 0 0 rgba(0, 0, 0, 0.35),
                0 2px 6px rgba(0, 0, 0, 0.25);
        }

        .new-chat svg {
            width: 15px;
            height: 15px;
        }

        .sidebar-topics {
            margin-top: 22px;

            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .sidebar-label {
            font-size: 11px;
            font-weight: 650;

            text-transform: uppercase;
            letter-spacing: 0.06em;

            color: var(--text-tertiary);

            padding: 0 6px 6px;
        }

        .topic-pill {
            display: flex;
            align-items: center;
            gap: 9px;

            padding: 8px 10px;

            border-radius: 8px;

            font-size: 13px;
            color: var(--text-secondary);

            cursor: pointer;
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
            font-family: inherit;

            transition:
                background 0.15s,
                color 0.15s,
                transform 0.2s var(--ease);
        }

        .topic-pill:hover {
            background: var(--surface-hover);
            color: var(--text-primary);

            transform: translateX(2px);
        }

        .topic-pill:active {
            transform: translateX(2px) scale(0.98);
            background: var(--accent-soft);
        }

        .topic-pill.selected {
            background: var(--accent-soft);
            color: var(--text-primary);
        }

        .topic-dot {
            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: var(--border-strong);

            flex-shrink: 0;
        }

        .sidebar-status {
            margin-top: auto;

            padding: 12px;

            border-radius: 10px;

            background: var(--surface);

            border: 1px solid var(--border);

            box-shadow:
                0 6px 16px rgba(0, 0, 0, 0.25);

            transition:
                box-shadow 0.3s var(--ease);
        }

        .sidebar-status:hover {
            box-shadow:
                0 12px 26px rgba(0, 0, 0, 0.4),
                0 0 0 1px var(--border-strong);
        }

        .sidebar-status-row {
            display: flex;
            align-items: center;
            gap: 7px;

            font-size: 12px;
            font-weight: 600;

            color: var(--text-primary);

            margin-bottom: 4px;
        }

        .status-dot {
            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: #34d399;

            box-shadow:
                0 0 8px rgba(52, 211, 153, 0.7);

            animation: pulseDot 2.4s ease-in-out infinite;
        }

        @keyframes pulseDot {
            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.45;
            }
        }

        .sidebar-status-sub {
            font-size: 11.5px;

            color: var(--text-tertiary);

            line-height: 1.5;
        }

        /* =========================================================
           MAIN
        ========================================================= */

        .main {
            flex: 1;

            display: flex;
            flex-direction: column;

            min-width: 0;
            height: 100vh;
        }

        /* =========================================================
           HEADER
        ========================================================= */

        .header {
            min-height: 64px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            gap: 3px;

            padding: 12px 24px;

            text-align: center;

            border-bottom: 1px solid var(--border);

            background: rgba(10, 10, 11, 0.72);

            backdrop-filter: blur(14px) saturate(150%);
            -webkit-backdrop-filter: blur(14px) saturate(150%);
        }

        .header-title {
            font-size: 15.5px;
            font-weight: 650;

            letter-spacing: -0.2px;
        }

        .header-subtitle {
            color: var(--text-tertiary);
            font-size: 12.5px;
        }

        /* =========================================================
           CHAT AREA
        ========================================================= */

        .chat-messages {
            flex: 1;

            overflow-y: auto;

            padding: 30px 20px 150px;

            perspective: 1200px;
        }

        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--border-strong);
            border-radius: 10px;
        }

        .message {
            width: 100%;

            display: flex;

            margin-bottom: 26px;

            animation: appear 0.4s var(--ease);
        }

        @keyframes appear {
            from {
                opacity: 0;

                transform:
                    translateY(10px)
                    rotateX(-6deg);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0)
                    rotateX(0deg);
            }
        }

        .message-inner {
            width: min(100%, 780px);

            margin: 0 auto;

            display: flex;

            gap: 14px;
        }

        /* =========================================================
           AVATARS
        ========================================================= */

        .avatar {
            width: 30px;
            height: 30px;

            flex-shrink: 0;

            border-radius: 8px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 11px;
            font-weight: 650;

            margin-top: 1px;
        }

        .user-avatar {
            background: var(--surface-2);

            border: 1px solid var(--border-strong);

            color: var(--text-primary);

            box-shadow:
                0 3px 8px rgba(0, 0, 0, 0.3);
        }

        /* =========================================================
           MESSAGE CONTENT
        ========================================================= */

        .message-body {
            min-width: 0;

            flex: 1;

            padding-top: 4px;

            font-size: 15px;
            line-height: 1.7;

            color: var(--text-primary);

            overflow-wrap: break-word;
        }

        .user-message .message-body {
            display: flex;
        }

        .user-message .message-content {
            background: var(--surface-2);

            border: 1px solid var(--border);

            padding: 10px 15px;

            border-radius: 16px 16px 4px 16px;

            display: inline-block;

            max-width: 100%;

            white-space: pre-wrap;

            box-shadow:
                0 4px 14px rgba(0, 0, 0, 0.28);
        }

        .user-message .message-content:hover {
            box-shadow:
                0 10px 26px rgba(0, 0, 0, 0.4),
                0 0 0 1px var(--border-strong);
        }

        /* =========================================================
           MARKDOWN
        ========================================================= */

        .message-body p {
            margin-bottom: 12px;
        }

        .message-body p:last-child {
            margin-bottom: 0;
        }

        .message-body h1,
        .message-body h2,
        .message-body h3 {
            margin: 20px 0 10px;

            line-height: 1.35;

            font-weight: 650;

            letter-spacing: -0.2px;
        }

        .message-body h1 {
            font-size: 22px;
        }

        .message-body h2 {
            font-size: 18.5px;
        }

        .message-body h3 {
            font-size: 16px;
        }

        .message-body ul,
        .message-body ol {
            margin: 8px 0 14px;
            padding-left: 24px;
        }

        .message-body li {
            margin: 5px 0;
        }

        .message-body strong {
            font-weight: 650;
            color: #ffffff;
        }

        .message-body a {
            color: var(--accent-strong);

            text-decoration-color:
                rgba(183, 203, 255, 0.35);

            text-underline-offset: 2px;
        }

        .message-body blockquote {
            border-left: 2px solid var(--border-strong);

            padding-left: 14px;

            color: var(--text-secondary);

            margin: 12px 0;
        }

        .message-body :not(pre) > code {
            background: var(--surface-2);

            border: 1px solid var(--border);

            color: var(--accent-strong);

            padding: 2px 6px;

            border-radius: 5px;

            font-family: var(--font-mono);

            font-size: 13px;
        }

        .message-body hr {
            border: none;

            border-top: 1px solid var(--border);

            margin: 20px 0;
        }

        /* =========================================================
           CODE BLOCKS
        ========================================================= */

        .code-block {
            border: 1px solid var(--border);

            border-radius: var(--radius-sm);

            overflow: hidden;

            background: var(--code-bg);

            margin: 14px 0;

            font-size: 13px;

            box-shadow:
                0 6px 18px rgba(0, 0, 0, 0.3);
        }

        .code-block:hover {
            box-shadow:
                0 14px 34px rgba(0, 0, 0, 0.45),
                0 0 0 1px rgba(134, 169, 242, 0.2);
        }

        .code-block-header {
            display: flex;

            align-items: center;
            justify-content: space-between;

            padding: 8px 14px;

            background: var(--surface-2);

            border-bottom: 1px solid var(--border);

            font-family: var(--font-mono);

            font-size: 11.5px;

            color: var(--text-tertiary);

            text-transform: lowercase;
        }

        .copy-btn {
            font-family: var(--font-sans);

            font-size: 11.5px;
            font-weight: 500;

            color: var(--text-secondary);

            background: transparent;

            border: none;

            cursor: pointer;

            display: flex;
            align-items: center;

            gap: 5px;

            padding: 3px 6px;

            border-radius: 6px;

            transition:
                color 0.15s,
                background 0.15s;
        }

        .copy-btn:hover {
            color: var(--text-primary);
            background: var(--surface-hover);
        }

        .copy-btn svg {
            width: 13px;
            height: 13px;
        }

        .code-block pre {
            margin: 0;

            padding: 14px;

            overflow-x: auto;
        }

        .code-block pre::-webkit-scrollbar {
            height: 6px;
        }

        .code-block pre::-webkit-scrollbar-thumb {
            background: var(--border-strong);
            border-radius: 10px;
        }

        .code-block code {
            font-family: var(--font-mono) !important;

            font-size: 13px;

            background: transparent !important;

            border: none !important;

            padding: 0 !important;
        }

        /* =========================================================
           MESSAGE ACTIONS
        ========================================================= */

        .message-actions {
            display: flex;

            gap: 4px;

            margin-top: 8px;

            opacity: 0;

            transition: opacity 0.15s;
        }

        .message:hover .message-actions {
            opacity: 1;
        }

        .action-btn {
            width: 27px;
            height: 27px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: transparent;

            border: none;

            color: var(--text-tertiary);

            cursor: pointer;

            border-radius: 7px;

            transition:
                color 0.15s,
                background 0.15s,
                transform 0.15s;
        }

        .action-btn:hover {
            color: var(--text-primary);

            background: var(--surface-hover);

            transform: translateY(-1px);
        }

        .action-btn svg {
            width: 14px;
            height: 14px;
        }

        /* =========================================================
           TYPING INDICATOR
        ========================================================= */

        .typing {
            display: flex;

            align-items: center;

            gap: 5px;

            padding-top: 6px;

            height: 18px;
        }

        .typing span {
            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: var(--text-tertiary);

            animation:
                typingAnimation 1.2s infinite;
        }

        .typing span:nth-child(2) {
            animation-delay: 0.15s;
        }

        .typing span:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes typingAnimation {
            0%,
            60%,
            100% {
                opacity: 0.3;
                transform: translateY(0);
            }

            30% {
                opacity: 1;
                transform: translateY(-3px);
            }
        }

        /* =========================================================
           INPUT AREA
        ========================================================= */

        .input-area {
            position: fixed;

            bottom: 0;

            right: 0;
            left: 264px;

            padding: 16px 20px 20px;

            background:
                linear-gradient(
                    to top,
                    var(--bg) 65%,
                    rgba(10, 10, 11, 0.9),
                    transparent
                );
        }

        .input-container {
            width: min(100%, 780px);

            margin: 0 auto;

            background: var(--surface);

            border: 1px solid var(--border-strong);

            border-radius: var(--radius-lg);

            display: flex;
            align-items: flex-end;

            padding: 8px 8px 8px 16px;

            box-shadow:
                0 14px 40px rgba(0, 0, 0, 0.4);

            transition:
                border-color 0.2s var(--ease),
                box-shadow 0.2s var(--ease),
                transform 0.2s var(--ease);
        }

        .input-container:focus-within {
            border-color: var(--accent);

            box-shadow:
                0 0 0 3px var(--accent-soft),
                0 14px 40px rgba(0, 0, 0, 0.4);

            transform: translateY(-1px);
        }

        #message-input {
            flex: 1;

            border: none;
            outline: none;

            resize: none;

            background: transparent;

            color: var(--text-primary);

            font-family: inherit;

            font-size: 15px;

            padding: 10px 0;

            max-height: 150px;

            line-height: 1.5;
        }

        #message-input::placeholder {
            color: var(--text-tertiary);
        }

        #send-button {
            width: 38px;
            height: 38px;

            flex-shrink: 0;

            border: none;

            border-radius: 11px;

            background: var(--text-primary);

            color: #000000;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            box-shadow:
                0 3px 0 rgba(0, 0, 0, 0.35),
                0 6px 14px rgba(0, 0, 0, 0.25);

            transition:
                transform 0.12s var(--ease),
                background 0.2s,
                box-shadow 0.12s var(--ease);
        }

        #send-button svg {
            width: 16px;
            height: 16px;
        }

        #send-button:hover:not(:disabled) {
            background: var(--accent-strong);

            transform: translateY(-1px);

            box-shadow:
                0 4px 0 rgba(0, 0, 0, 0.35),
                0 9px 20px rgba(0, 0, 0, 0.3);
        }

        #send-button:active:not(:disabled) {
            transform: translateY(2px);

            box-shadow:
                0 0 0 rgba(0, 0, 0, 0.35),
                0 2px 6px rgba(0, 0, 0, 0.25);
        }

        #send-button:disabled {
            background: var(--surface-2);

            color: var(--text-tertiary);

            cursor: not-allowed;

            box-shadow: none;
        }

        .input-hint {
            width: min(100%, 780px);

            margin: 9px auto 0;

            text-align: center;

            color: var(--text-tertiary);

            font-size: 11px;
        }

        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 800px) {

            .sidebar {
                display: none;
            }

            .input-area {
                left: 0;

                padding-left: 12px;
                padding-right: 12px;
            }

            .header {
                padding: 12px 16px;
            }

            .header-subtitle {
                display: none;
            }

            .chat-messages {
                padding-left: 14px;
                padding-right: 14px;
            }

            .message-inner {
                gap: 10px;
            }

            .user-message .message-content {
                max-width: 85%;
            }

            .avatar,
            .orb.small {
                width: 27px;
                height: 27px;
            }

            .message-body {
                font-size: 14px;
            }
        }

    </style>
</head>

<body>

    <div class="app">

        <!-- =====================================================
             SIDEBAR
        ====================================================== -->

        <aside class="sidebar">

            <div class="brand-row">
                <div class="orb tiny tilt-el">
                    <span class="orb-spin"></span>
                </div>

                <div class="brand-name">
                    LearnMate AI
                </div>
            </div>

            <button
                class="new-chat tilt-el"
                id="new-chat"
                type="button"
            >
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>

                New chat
            </button>

     <div class="sidebar-topics" id="sidebar-topics">

         <div class="sidebar-label">Explore Topics Like :</div>

            <button type="button" class="topic-pill" data-topic="Python and Programming">
                 <span class="topic-dot"></span>Python and Programming
            </button>

            <button type="button" class="topic-pill" data-topic="Data Science and Analytics">
                <span class="topic-dot"></span>Data Science and Analytics
            </button>

            <button type="button" class="topic-pill" data-topic="Machine Learning Concepts">
                <span class="topic-dot"></span>Machine Learning Concepts
            </button>

            <button type="button" class="topic-pill" data-topic="Generative AI and LLMs">
                <span class="topic-dot"></span>Generative AI and LLMs
            </button>

            <button type="button" class="topic-pill" data-topic="SQL and Databases">
                <span class="topic-dot"></span>SQL and Databases
            </button>

            <button type="button" class="topic-pill" data-topic="Data Structures and Algorithms">
                <span class="topic-dot"></span>Data Structures and Algorithms
            </button>

            <button type="button" class="topic-pill" data-topic="Deep Learning Concepts">
                <span class="topic-dot"></span>Deep Learning Concepts
            </button>

            <button type="button" class="topic-pill" data-topic="Web Development and APIs">
                <span class="topic-dot"></span>Web Development and APIs
            </button>

            <button type="button" class="topic-pill" data-topic="Statistics and Mathematics">
                <span class="topic-dot"></span>Statistics and Mathematics
            </button>

            <button type="button" class="topic-pill" data-topic="AI Tools and Frameworks">
                <span class="topic-dot"></span>AI Tools and Frameworks
            </button>

        </div>

            <div class="sidebar-status tilt-el">

                <div class="sidebar-status-row">
                    <span class="status-dot"></span>
                    Learning Mode: Active
                </div>

                <div class="sidebar-status-sub">
                    Your Friendly AI Companion is Ready!
                </div>

            </div>

        </aside>

        <!-- =====================================================
             MAIN
        ====================================================== -->

        <main class="main">

            <header class="header">

                <div class="header-title">
                    Turn Questions Into Knowledge🌟
                </div>

                <div class="header-subtitle">
                   Explore knowledge, Solve challenges, Build your future!
                </div>

            </header>

            <!-- =================================================
                 CHAT MESSAGES
            ================================================== -->

            <section
                id="chat-messages"
                class="chat-messages"
                aria-live="polite"
                aria-label="Chat messages"
            >

                <div class="message bot-message">

                    <div class="message-inner">

                        <div class="orb small tilt-el">
                            <span class="orb-spin"></span>
                        </div>

                        <div class="message-body">

                            <div class="message-content">
                                <p>
                                    Hiii👋 I'm LearnMate. How can I help you today?
                                </p>
                            </div>

                        </div>

                    </div>

                </div>

            </section>

            <!-- =================================================
                 INPUT
            ================================================== -->

            <div class="input-area">

                <div class="input-container">

                    <textarea
                        id="message-input"
                        rows="1"
                        placeholder="Message your AI Learning Assistant..."
                        autocomplete="off"
                        aria-label="Message"
                    ></textarea>

                    <button
                        id="send-button"
                        type="button"
                        title="Send message"
                        aria-label="Send message"
                        disabled
                    >
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2.4"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <line x1="12" y1="19" x2="12" y2="5"></line>
                            <polyline points="6 11 12 5 18 11"></polyline>
                        </svg>
                    </button>

                </div>

                <div class="input-hint">
                    AI can make mistakes. Check important information.
                </div>

            </div>

        </main>

    </div>

    <script>

        /* =========================================================
           CONVERSATION
        ========================================================= */

        let conversationId =
            typeof crypto !== "undefined" && crypto.randomUUID
                ? crypto.randomUUID()
                : "conversation-" + Date.now();

        const messageInput =
            document.getElementById("message-input");

        const sendButton =
            document.getElementById("send-button");

        const chatMessages =
            document.getElementById("chat-messages");

        const newChatButton =
            document.getElementById("new-chat");

        const sidebarTopics =
            document.getElementById("sidebar-topics");


        /* =========================================================
           ICONS
        ========================================================= */

        const ICON_COPY = `
            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
            >
                <rect
                    x="9"
                    y="9"
                    width="13"
                    height="13"
                    rx="2"
                ></rect>

                <path
                    d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"
                ></path>
            </svg>
        `;

        const ICON_CHECK = `
            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.4"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
            >
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        `;


        /* =========================================================
           MARKDOWN CONFIGURATION
        ========================================================= */

        marked.setOptions({
            breaks: true,
            gfm: true
        });


        /* =========================================================
           AMBIENT CURSOR PARALLAX
        ========================================================= */

        window.addEventListener("mousemove", function (event) {

            const mx =
                (event.clientX / window.innerWidth) * 100;

            const my =
                (event.clientY / window.innerHeight) * 100;

            document.documentElement.style.setProperty(
                "--mx",
                mx + "%"
            );

            document.documentElement.style.setProperty(
                "--my",
                my + "%"
            );

        });


        /* =========================================================
           3D TILT
        ========================================================= */

        function addTilt(
            element,
            maxTilt = 10,
            scale = 1.03
        ) {

            if (
                !element ||
                element.dataset.tiltBound
            ) {
                return;
            }

            element.dataset.tiltBound = "true";

            element.addEventListener(
                "mousemove",
                function (event) {

                    const rect =
                        element.getBoundingClientRect();

                    const x =
                        event.clientX - rect.left;

                    const y =
                        event.clientY - rect.top;

                    const rx =
                        -(
                            ((y / rect.height) - 0.5)
                            * maxTilt
                        );

                    const ry =
                        (
                            ((x / rect.width) - 0.5)
                            * maxTilt
                        );

                    element.style.transform =
                        `perspective(700px)
                         rotateX(${rx}deg)
                         rotateY(${ry}deg)
                         scale(${scale})`;
                }
            );

            element.addEventListener(
                "mouseleave",
                function () {
                    element.style.transform = "";
                }
            );
        }


        function bindTilts(root = document) {

            root
                .querySelectorAll(".orb.tilt-el")
                .forEach(function (element) {
                    addTilt(element, 22, 1.12);
                });

            root
                .querySelectorAll(".new-chat, .sidebar-status")
                .forEach(function (element) {
                    addTilt(element, 6, 1.01);
                });

            root
                .querySelectorAll(
                    ".user-message .message-content"
                )
                .forEach(function (element) {
                    addTilt(element, 4, 1.01);
                });

            root
                .querySelectorAll(".code-block")
                .forEach(function (element) {
                    addTilt(element, 3, 1.005);
                });
        }


        /* =========================================================
           COPY TO CLIPBOARD
        ========================================================= */

        async function copyToClipboard(text) {

            try {

                if (
                    navigator.clipboard &&
                    window.isSecureContext
                ) {
                    await navigator.clipboard.writeText(text);
                    return true;
                }

                const textarea =
                    document.createElement("textarea");

                textarea.value = text;

                textarea.style.position = "fixed";
                textarea.style.opacity = "0";

                document.body.appendChild(textarea);

                textarea.select();

                const successful =
                    document.execCommand("copy");

                textarea.remove();

                return successful;

            } catch (error) {

                console.error(
                    "Clipboard error:",
                    error
                );

                return false;
            }
        }


        /* =========================================================
           ENHANCE CODE BLOCKS
        ========================================================= */

        function enhanceCodeBlocks(container) {

            container
                .querySelectorAll("pre code")
                .forEach(function (codeElement) {

                    if (
                        codeElement.dataset.enhanced === "true"
                    ) {
                        return;
                    }

                    codeElement.dataset.enhanced = "true";

                    /* Highlight code */

                    if (
                        typeof hljs !== "undefined"
                    ) {

                        try {
                            hljs.highlightElement(
                                codeElement
                            );
                        } catch (error) {
                            console.warn(
                                "Syntax highlighting failed:",
                                error
                            );
                        }
                    }


                    /* Detect language */

                    const languageClass =
                        Array.from(
                            codeElement.classList
                        ).find(function (className) {
                            return className.startsWith(
                                "language-"
                            );
                        });

                    const language =
                        languageClass
                            ? languageClass.replace(
                                "language-",
                                ""
                            )
                            : "text";


                    const pre =
                        codeElement.parentElement;


                    /* Create wrapper */

                    const wrapper =
                        document.createElement("div");

                    wrapper.className =
                        "code-block";


                    /* Header */

                    const header =
                        document.createElement("div");

                    header.className =
                        "code-block-header";


                    const languageLabel =
                        document.createElement("span");

                    languageLabel.textContent =
                        language;


                    /* Copy button */

                    const copyButton =
                        document.createElement("button");

                    copyButton.type = "button";

                    copyButton.className =
                        "copy-btn";

                    copyButton.innerHTML =
                        `${ICON_COPY}<span>Copy</span>`;


                    copyButton.addEventListener(
                        "click",
                        async function () {

                            const success =
                                await copyToClipboard(
                                    codeElement.textContent
                                );

                            if (success) {

                                copyButton.innerHTML =
                                    `${ICON_CHECK}<span>Copied</span>`;

                                setTimeout(
                                    function () {

                                        copyButton.innerHTML =
                                            `${ICON_COPY}<span>Copy</span>`;

                                    },
                                    1600
                                );

                            } else {

                                copyButton.innerHTML =
                                    `<span>Failed</span>`;

                                setTimeout(
                                    function () {

                                        copyButton.innerHTML =
                                            `${ICON_COPY}<span>Copy</span>`;

                                    },
                                    1600
                                );
                            }
                        }
                    );


                    header.appendChild(
                        languageLabel
                    );

                    header.appendChild(
                        copyButton
                    );


                    /* Insert wrapper */

                    pre.parentNode.insertBefore(
                        wrapper,
                        pre
                    );

                    wrapper.appendChild(
                        header
                    );

                    wrapper.appendChild(
                        pre
                    );

                });
        }


        /* =========================================================
           ADD MESSAGE
        ========================================================= */

        function addMessage(
            message,
            sender
        ) {

            const messageDiv =
                document.createElement("div");

            messageDiv.className =
                `message ${sender}-message`;


            const inner =
                document.createElement("div");

            inner.className =
                "message-inner";


            /* =====================================================
               AVATAR
            ====================================================== */

            let avatar;

            if (sender === "user") {

                avatar =
                    document.createElement("div");

                avatar.className =
                    "avatar user-avatar";

                avatar.textContent =
                    "YOU";

            } else {

                avatar =
                    document.createElement("div");

                avatar.className =
                    "orb small tilt-el";

                avatar.innerHTML =
                    `<span class="orb-spin"></span>`;
            }


            /* =====================================================
               BODY
            ====================================================== */

            const body =
                document.createElement("div");

            body.className =
                "message-body";


            /* =====================================================
               BOT MESSAGE
            ====================================================== */

            if (sender === "bot") {

                const content =
                    document.createElement("div");

                content.className =
                    "message-content";


                let renderedHTML = "";

                try {

                    renderedHTML =
                        marked.parse(
                            String(message)
                        );

                } catch (error) {

                    console.error(
                        "Markdown rendering error:",
                        error
                    );

                    renderedHTML =
                        `<p>${String(message)}</p>`;
                }


                if (
                    typeof DOMPurify !== "undefined"
                ) {

                    content.innerHTML =
                        DOMPurify.sanitize(
                            renderedHTML
                        );

                } else {

                    content.textContent =
                        message;
                }


                enhanceCodeBlocks(content);

                body.appendChild(
                    content
                );


                /* =================================================
                   MESSAGE ACTIONS
                ================================================== */

                const actions =
                    document.createElement("div");

                actions.className =
                    "message-actions";


                const copyMessageButton =
                    document.createElement("button");

                copyMessageButton.type =
                    "button";

                copyMessageButton.className =
                    "action-btn";

                copyMessageButton.title =
                    "Copy response";

                copyMessageButton.setAttribute(
                    "aria-label",
                    "Copy response"
                );

                copyMessageButton.innerHTML =
                    ICON_COPY;


                copyMessageButton.addEventListener(
                    "click",
                    async function () {

                        const success =
                            await copyToClipboard(
                                String(message)
                            );

                        if (success) {

                            copyMessageButton.innerHTML =
                                ICON_CHECK;

                            setTimeout(
                                function () {

                                    copyMessageButton.innerHTML =
                                        ICON_COPY;

                                },
                                1600
                            );

                        }

                    }
                );


                actions.appendChild(
                    copyMessageButton
                );

                body.appendChild(
                    actions
                );


            } else {

                /* =================================================
                   USER MESSAGE
                ================================================== */

                const content =
                    document.createElement("div");

                content.className =
                    "message-content";

                content.textContent =
                    message;

                body.appendChild(
                    content
                );
            }


            /* =====================================================
               APPEND MESSAGE
            ====================================================== */

            inner.appendChild(
                avatar
            );

            inner.appendChild(
                body
            );

            messageDiv.appendChild(
                inner
            );

            chatMessages.appendChild(
                messageDiv
            );


            bindTilts(
                messageDiv
            );

            scrollToBottom();
        }


        /* =========================================================
           TYPING INDICATOR
        ========================================================= */

        function showTypingIndicator() {

            removeTypingIndicator();


            const messageDiv =
                document.createElement("div");

            messageDiv.className =
                "message bot-message";

            messageDiv.id =
                "typing-indicator";


            messageDiv.innerHTML = `
                <div class="message-inner">

                    <div class="orb small tilt-el">
                        <span class="orb-spin"></span>
                    </div>

                    <div class="message-body">

                        <div class="message-content">

                            <div class="typing">
                                <span></span>
                                <span></span>
                                <span></span>
                            </div>

                        </div>

                    </div>

                </div>
            `;


            chatMessages.appendChild(
                messageDiv
            );

            bindTilts(
                messageDiv
            );

            scrollToBottom();
        }


        function removeTypingIndicator() {

            const indicator =
                document.getElementById(
                    "typing-indicator"
                );

            if (indicator) {
                indicator.remove();
            }
        }


        /* =========================================================
           SCROLL
        ========================================================= */

        function scrollToBottom() {

            chatMessages.scrollTo({
                top: chatMessages.scrollHeight,
                behavior: "smooth"
            });
        }


        /* =========================================================
           INPUT STATE
        ========================================================= */

        function refreshSendState() {

            sendButton.disabled =
                messageInput.value.trim().length === 0;
        }


        function resizeInput() {

            messageInput.style.height =
                "auto";

            messageInput.style.height =
                Math.min(
                    messageInput.scrollHeight,
                    150
                ) + "px";
        }


        messageInput.addEventListener(
            "input",
            function () {

                resizeInput();

                refreshSendState();
            }
        );


        /* =========================================================
           SEND MESSAGE
        ========================================================= */

        async function sendMessage(prefillText) {

            /* Allow calling with a pre-filled string (e.g. from a
               topic click) or with no arguments (normal send). */

            if (typeof prefillText === "string") {
                messageInput.value = prefillText;
                resizeInput();
                refreshSendState();
            }

            const message =
                messageInput.value.trim();


            if (
                !message ||
                sendButton.disabled
            ) {
                return;
            }


            /* Add user message */

            addMessage(
                message,
                "user"
            );


            /* Clear input */

            messageInput.value = "";

            resizeInput();

            refreshSendState();


            /* Disable sending */

            sendButton.disabled =
                true;

            showTypingIndicator();


            try {

                const response =
                    await fetch(
                        "/chat",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                conversation_id:
                                    conversationId,

                                message:
                                    message
                            })
                        }
                    );


                /* Parse response */

                let data = {};

                try {

                    data =
                        await response.json();

                } catch (jsonError) {

                    console.error(
                        "Invalid JSON response:",
                        jsonError
                    );
                }


                removeTypingIndicator();


                /* Server error */

                if (!response.ok) {

                    addMessage(
                        data.error ||
                        `Server error (${response.status}). Please try again.`,
                        "bot"
                    );

                    return;
                }


                /* Empty response */

                if (
                    !data.response ||
                    String(data.response).trim() === ""
                ) {

                    addMessage(
                        "The AI returned an empty response. Please try again.",
                        "bot"
                    );

                    return;
                }


                /* Successful response */

                addMessage(
                    data.response,
                    "bot"
                );


            } catch (error) {

                console.error(
                    "Connection error:",
                    error
                );

                removeTypingIndicator();


                addMessage(
                    "I couldn't connect to the server right now. Please make sure the Flask application is running and try again.",
                    "bot"
                );


            } finally {

                refreshSendState();

                messageInput.focus();
            }
        }


        /* =========================================================
           SEND BUTTON
        ========================================================= */

        sendButton.addEventListener(
            "click",
            function () {
                sendMessage();
            }
        );


        /* =========================================================
           ENTER TO SEND
        ========================================================= */

        messageInput.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Enter" &&
                    !event.shiftKey
                ) {

                    event.preventDefault();

                    sendMessage();
                }
            }
        );


        /* =========================================================
           TOPIC PILLS -> SEND MESSAGE ABOUT THAT TOPIC
        ========================================================= */

        sidebarTopics.addEventListener(
            "click",
            function (event) {

                const pill =
                    event.target.closest(".topic-pill");

                if (!pill) {
                    return;
                }

                const topic =
                    pill.dataset.topic ||
                    pill.textContent.trim();

                /* Visual feedback: mark this pill as selected */

                sidebarTopics
                    .querySelectorAll(".topic-pill")
                    .forEach(function (element) {
                        element.classList.remove("selected");
                    });

                pill.classList.add("selected");

                /* Fill the input with a question about the topic
                   and send it right away */

                sendMessage(`Can you teach me about ${topic}?`);
            }
        );


        /* =========================================================
           NEW CHAT
        ========================================================= */

        newChatButton.addEventListener(
            "click",
            function () {

                /* Create new conversation ID */

                conversationId =
                    typeof crypto !== "undefined" &&
                    crypto.randomUUID
                        ? crypto.randomUUID()
                        : "conversation-" + Date.now();


                /* Clear chat */

                chatMessages.innerHTML = `

                    <div class="message bot-message">

                        <div class="message-inner">

                            <div class="orb small tilt-el">
                                <span class="orb-spin"></span>
                            </div>

                            <div class="message-body">

                                <div class="message-content">

                                    <p>
                                        Hiiii 👋 I'm LearnMate, how can I help you today?
                                    </p>

                                </div>

                            </div>

                        </div>

                    </div>

                `;


                bindTilts(
                    chatMessages
                );


                /* Clear any selected topic highlight */

                sidebarTopics
                    .querySelectorAll(".topic-pill")
                    .forEach(function (element) {
                        element.classList.remove("selected");
                    });


                messageInput.value = "";

                resizeInput();

                refreshSendState();

                messageInput.focus();

                scrollToBottom();
            }
        );


        /* =========================================================
           INITIAL SETUP
        ========================================================= */

        window.addEventListener(
            "load",
            function () {

                bindTilts(
                    document
                );

                resizeInput();

                refreshSendState();

                messageInput.focus();
            }
        );

    </script>

</body>
</html>
